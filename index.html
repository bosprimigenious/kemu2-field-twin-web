<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>科目二训练场</title>
  <style>:root {
  font-family: "Aptos", "Segoe UI", "Microsoft YaHei", sans-serif;
  background: #eff1ec;
  color: #22352f;
  font-synthesis: none;
  --muted: #5e7066;
  --line: #d8dfd5;
  --white: #fafbf7;
  --green: #285747;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; min-width: 300px; }
h1, h2, p { margin: 0; }
button { cursor: pointer; color: inherit; font: inherit; }
button:focus-visible { outline: 2px solid #257962; outline-offset: 3px; }
.topbar {
  min-height: 75px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  padding: 13px clamp(15px, 3.2vw, 49px);
  border-bottom: 1px solid #d5ddd2;
  background: #fafbf8;
}
.branding { display: flex; align-items: center; gap: 13px; }
.branding h1 { font-weight: 710; font-size: 1.29rem; letter-spacing: .035em; }
.branding p { color: var(--muted); font-size: .77rem; margin-top: 2px; }
.wordmark { display: grid; place-content: center; gap: 4px; width: 41px; height: 41px; border-radius: 11px; background: #285747; }
.wordmark span { display: block; width: 18px; height: 4px; border-radius: 2px; background: #b9dfbd; transform: skew(-23deg); }
.wordmark span:last-child { width: 13px; margin-left: 4px; }
.mode { display: flex; gap: 8px; align-items: center; padding: 7px 12px; border: 1px solid #d6e4d7; border-radius: 20px; background: #edf5e9; color: #355c46; font-size: .78rem; white-space: nowrap; }
.mode span { width: 7px; height: 7px; border-radius: 50%; background: #61856c; }
.workspace { display: grid; grid-template-columns: minmax(185px, 236px) minmax(0, 1fr); align-items: start; gap: 20px; max-width: 1720px; margin: 0 auto; padding: 22px clamp(15px, 3.2vw, 49px) 24px; }
.browse, .stage { border: 1px solid var(--line); border-radius: 14px; background: var(--white); }
.browse { display: grid; padding: 15px 12px 13px; }
.browse-head { display: flex; align-items: center; justify-content: space-between; padding: 1px 6px 13px; }
.browse-head h2 { font-size: .88rem; }
.browse-head > span { color: var(--muted); font-size: .73rem; }
.zone-list { display: grid; gap: 5px; }
.zone-button {
  min-width: 0;
  width: 100%;
  display: grid;
  grid-template-columns: 31px minmax(0, 1fr);
  gap: 9px;
  align-items: center;
  text-align: left;
  padding: 8px 7px;
  min-height: 45px;
  border: 1px solid transparent;
  border-radius: 8px;
  background: transparent;
  font-weight: 570;
  font-size: .86rem;
}
.zone-button:hover { background: #edf2ea; }
.zone-button[aria-current="true"] { background: #e6efe4; color: #265745; border-color: #d2e2d1; }
.zone-number { display: grid; place-items: center; padding: 4px; border: 1px solid #dce4d9; border-radius: 6px; color: #536e5d; background: #eef2eb; font: 600 .74rem/1.3 "Aptos", "Segoe UI", sans-serif; font-variant-numeric: tabular-nums; }
.zone-button[aria-current="true"] .zone-number { background: #2e5e4b; border-color: #2e5e4b; color: #fff; }
.overview .zone-number i { width: 11px; height: 9px; border: 1.5px solid currentColor; border-radius: 1px; position: relative; }
.overview .zone-number i::before { content: ""; position: absolute; left: 3px; top: 0; bottom: 0; border-left: 1px solid currentColor; }
.browse-note { display: flex; align-items: flex-start; gap: 8px; margin: 13px 5px 0; padding-top: 12px; border-top: 1px solid var(--line); color: var(--muted); font-size: .74rem; line-height: 1.6; }
.location-mark { width: 8px; height: 8px; border-radius: 50%; border: 2px solid #547d66; margin-top: 5px; flex: none; }
.stage { overflow: hidden; min-width: 0; }
.stage-head { display: flex; align-items: center; justify-content: space-between; padding: 11px 14px 11px 18px; gap: 15px; }
.stage-head h2 { font-size: clamp(.90rem, 1.25vw, 1.12rem); font-weight: 690; }
.camera-controls { flex: none; display: flex; gap: 3px; border: 1px solid #dfe5dc; border-radius: 9px; padding: 3px; background: #eff2ec; }
.camera-controls button { border: 1px solid transparent; border-radius: 6px; background: transparent; padding: 5px 10px; color: #4f665b; font-size: .78rem; white-space: nowrap; }
.camera-controls button[aria-pressed="true"] { background: #fff; border-color: #dbe2d7; color: #214f40; font-weight: 670; }
.viewport { position: relative; height: clamp(382px, 61vh, 710px); background: #cfdbcd; overflow: hidden; isolation: isolate; }
#scene { display: block; width: 100%; height: 100%; }
.scene-annotations { position: absolute; inset: 0; pointer-events: none; }
.scene-label { position: absolute; transform: translate(-50%, -58%); display: flex; align-items: center; gap: 5px; border-radius: 5px; padding: 4px 6px; white-space: nowrap; letter-spacing: .01em; line-height: 1.18; }
.map-label { pointer-events: auto; background: #fcfdf7; border: 1px solid #c4d3c3; color: #244839; font-size: .74rem; font-weight: 680; box-shadow: 0 2px 4px #26413433; }
.map-label:hover { background: #def3e3; }
.map-label .map-number { color: #4d735e; font-size: .66rem; }
.landmark { background: #233e35; border: 1px solid #ffffff63; color: #fffdf3; font-size: .72rem; transform: translate(-50%, -82%); }
.north { display: grid; gap: 2px; justify-items: center; position: absolute; top: 12px; right: 12px; border: 1px solid #afc2b2; border-radius: 7px; padding: 5px 7px; background: #f6faf0f2; color: #355444; font-size: .74rem; pointer-events: none; }
#north-arrow { display: block; width: 12px; height: 16px; background: #3b6854; clip-path: polygon(50% 0, 100% 100%, 50% 72%, 0 100%); }
.legend { display: flex; flex-wrap: wrap; gap: 9px; position: absolute; bottom: 12px; left: 12px; padding: 7px 9px; border: 1px solid #afc2b2; border-radius: 7px; background: #f6faf0f2; color: #324d40; font-size: .72rem; pointer-events: none; }
.legend > span { display: flex; gap: 5px; align-items: center; }
.legend i { display: block; }
.start-symbol { width: 9px; height: 9px; border: 2px solid #4c846f; border-radius: 50%; }
.direction-symbol { width: 17px; height: 7px; background: #329879; clip-path: polygon(0 35%, 72% 35%, 72% 0, 100% 50%, 72% 100%, 72% 65%, 0 65%); }
.reverse-symbol { background: #b26a29; clip-path: polygon(0 35%, 24% 35%, 24% 65%, 0 65%, 36% 65%, 36% 35%, 72% 35%, 72% 0, 100% 50%, 72% 100%, 72% 65%, 36% 65%); }
.scene-error { position: absolute; inset: 0; z-index: 2; display: grid; place-items: center; padding: 20px; background: #e9f0e6; text-align: center; }
.stage-caption { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 18px; min-height: 49px; font-size: .81rem; color: #40584a; }
.stage-caption output { flex: none; color: var(--muted); white-space: nowrap; font-size: .73rem; }
.drive-bar { display: flex; justify-content: space-between; gap: 8px 14px; align-items: center; flex-wrap: wrap; padding: 8px 15px; background: #f0f4ed; border-top: 1px solid var(--line); }
.drive-controls, .drive-data { display: flex; align-items: center; gap: 6px; }
.drive-controls { flex-wrap: wrap; }
.drive-controls button { background: #fff; border: 1px solid #cfdbd0; border-radius: 7px; padding: 6px 9px; font-size: .79rem; white-space: nowrap; }
.drive-controls button:hover { background: #e4eee4; }
.drive-controls button[aria-pressed="true"] { background: #285747; color: #fff; border-color: #285747; }
#brake-drive { color: #8f412f; }
.drive-data { flex-wrap: wrap; gap: 7px 10px; font-size: .77rem; color: #40584a; }
#drive-speed { min-width: 6.4em; text-align: right; font-variant-numeric: tabular-nums; }
#drive-error { min-width: 6.6em; text-align: right; color: #2d6a55; font-variant-numeric: tabular-nums; }
.drive-keys { padding: 0 18px 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px; align-items: center; font-size: .73rem; }
.drive-keys kbd { padding: 1px 4px; border: 1px solid #d6dfd5; border-radius: 4px; background: #f0f3ee; }
@media (max-width: 820px) {
  .workspace { grid-template-columns: minmax(0, 1fr); gap: 11px; padding-top: 13px; }
  .browse { padding: 7px; }
  .browse-head, .browse-note { display: none; }
  .zone-list { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; }
  .zone-button { min-height: 40px; padding: 5px; font-size: .76rem; gap: 4px; grid-template-columns: 24px minmax(0, 1fr); }
  .zone-number { padding: 3px 1px; font-size: .68rem; }
  .viewport { height: clamp(350px, 57vh, 600px); }
}
@media (max-width: 520px) {
  .topbar { min-height: 63px; padding: 10px 13px; }
  .branding { gap: 8px; }
  .branding h1 { font-size: 1.07rem; }
  .wordmark { width: 35px; height: 35px; }
  .workspace { padding-inline: 9px; }
  .stage-head, .stage-caption { padding-inline: 10px; }
  .drive-bar, .drive-keys { padding-inline: 10px; }
  .camera-controls button { padding-inline: 6px; }
  .stage-caption { align-items: flex-start; flex-direction: column; gap: 4px; }
  .map-label .label-name { display: none; }
  .map-label { padding: 4px 5px; }
}
</style>
</head>
<body>
  <header class="topbar">
    <div class="branding">
      <div class="wordmark" aria-hidden="true"><span></span><span></span></div>
      <div><h1>科目二训练场</h1><p>智能车数字孪生</p></div>
    </div>
    <span class="mode"><span></span>驾驶仿真</span>
  </header>
  <main class="workspace">
    <aside class="browse" aria-label="场区导航">
      <div class="browse-head"><h2>训练项目</h2><span>5 项</span></div>
      <nav id="zone-list" class="zone-list" aria-label="训练项目">
        <button type="button" class="zone-button overview" id="overview" aria-current="true"><span class="zone-number"><i></i></span><span>全场概览</span></button>
      </nav>
      <div class="browse-note"><span class="location-mark" aria-hidden="true"></span><span>场地采用米制坐标<br>路线为课堂示意</span></div>
    </aside>
    <section class="stage" aria-label="三维训练场">
      <div class="stage-head">
        <h2 id="scene-title">全场概览</h2>
        <div class="camera-controls" role="group" aria-label="相机视角">
          <button type="button" id="camera-top" aria-pressed="false">俯视</button>
          <button type="button" id="camera-angle" aria-pressed="true">斜视</button>
          <button type="button" id="camera-follow" aria-pressed="false">跟随</button>
        </div>
      </div>
      <div class="drive-bar">
        <div class="drive-controls" role="group" aria-label="驾驶控制">
          <button type="button" id="manual-drive" aria-pressed="true">手动驾驶</button>
          <button type="button" id="auto-drive" aria-pressed="false">自动驾驶</button>
          <button type="button" id="brake-drive">停车</button>
          <button type="button" id="reset-drive">重置</button>
        </div>
        <div class="drive-data">
          <span id="drive-status" role="status">选择项目或按 W 开始</span>
          <output id="drive-speed" aria-label="速度" aria-live="off">0.0 km/h</output>
          <output id="drive-error" aria-label="横向偏差" aria-live="off">偏差 —</output>
        </div>
      </div>
      <div class="viewport">
        <canvas id="scene" aria-label="科目二训练场三维画面"></canvas>
        <div id="scene-annotations" class="scene-annotations"></div>
        <div class="north" aria-label="北向"><span>北</span><span id="north-arrow" aria-hidden="true"></span></div>
        <div class="legend" aria-label="场地图例">
          <span><i class="start-symbol"></i>起点</span>
          <span><i class="direction-symbol"></i>前进</span>
          <span><i class="direction-symbol reverse-symbol"></i>倒车</span>
        </div>
        <p id="scene-error" class="scene-error" role="alert" hidden></p>
      </div>
      <div class="stage-caption">
        <p id="zone-description" aria-live="polite">沿着连接道浏览倒库、侧方、曲线、直角和坡道。</p>
        <output id="zone-metric">课堂参考场地</output>
      </div>
      <p class="drive-keys"><kbd>W</kbd> 前进 <kbd>S</kbd> 倒车 <kbd>A</kbd><kbd>D</kbd> 转向 <kbd>Space</kbd> 停车</p>
    </section>
  </main>
